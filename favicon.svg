<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131b2a"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- App Background Tile -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Candlestick 1 (Bullish green) -->
  <line x1="22" y1="18" x2="22" y2="48" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <rect x="18" y="24" width="8" height="18" rx="2" fill="#10b981"/>
  
  <!-- Candlestick 2 (Bullish cyan/blue) -->
  <line x1="36" y1="12" x2="36" y2="44" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <rect x="32" y="16" width="8" height="20" rx="2" fill="#3b82f6"/>
  
  <!-- Ascending Trend Path with Glow -->
  <path d="M12 42 L24 28 L36 32 L52 14" fill="none" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Peak Dot -->
  <circle cx="52" cy="14" r="3.5" fill="#34d399"/>
</svg>
